<script>

const borrowRequests = [

    {
        id: 1,
        item: "Scientific Calculator",
        owner: "Arjun",
        location: "Library",
        date: "2 October 2026",
        period: "3 days",
        status: "pending"
    },

    {
        id: 2,
        item: "Engineering Drawing Kit",
        owner: "Ananya",
        location: "CSE Block",
        date: "30 September 2026",
        period: "2 days",
        status: "approved"
    },

    {
        id: 3,
        item: "Lab Coat",
        owner: "Rahul",
        location: "Physics Department",
        date: "28 September 2026",
        period: "1 day",
        status: "rejected"
    }

];



/* =========================
   DISPLAY REQUESTS
========================= */

function displayRequests(filter = "all") {

    const container =
        document.getElementById("borrowRequests");


    const filtered =
        filter === "all"
            ? borrowRequests
            : borrowRequests.filter(
                request =>
                    request.status === filter
            );


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="borrow-empty">

                <div class="borrow-empty-icon">
                    📚
                </div>

                <h2>
                    No borrow request
                </h2>

                <p>
                    You don't have any
                    ${filter === "all" ? "" : filter}
                    borrow request.
                </p>

                <a
                    href="products.html"
                    class="primary-btn">

                    Browse Items

                </a>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered.map(request => `

            <div class="borrow-card">


                <div class="borrow-item-icon">
                    📚
                </div>


                <div class="borrow-info">

                    <h3>
                        ${request.item}
                    </h3>


                    <p>
                        👤 Owner:
                        ${request.owner}
                    </p>


                    <p>
                        📍
                        ${request.location}
                    </p>


                    <p>
                        📅 Requested:
                        ${request.date}
                    </p>


                    <p>
                        ⏱ Borrow period:
                        ${request.period}
                    </p>

                </div>


                <div class="borrow-status">

                    <span
                        class="status ${request.status}">

                        ${
                            request.status === "pending"
                                ? "🟡 Pending"
                                : request.status === "approved"
                                    ? "🟢 Approved"
                                    : "🔴 Rejected"
                        }

                    </span>


                    ${
                        request.status === "pending"
                            ? `
                                <button
                                    class="cancel-borrow-btn"
                                    onclick="cancelRequest(${request.id})">

                                    Cancel Request

                                </button>
                            `
                            : ""
                    }

                </div>


            </div>

        `).join("");

}



/* =========================
   FILTER REQUESTS
========================= */

function filterRequests(status, button) {

    document
        .querySelectorAll(".borrow-filter")
        .forEach(filterButton => {

            filterButton.classList.remove("active");

        });


    button.classList.add("active");


    displayRequests(status);

}



/* =========================
   CANCEL REQUEST
========================= */

function cancelRequest(id) {

    const index =
        borrowRequests.findIndex(
            request =>
                request.id === id
        );


    if (index !== -1) {

        borrowRequests.splice(
            index,
            1
        );

    }


    displayRequests();


    alert(
        "Borrow request cancelled."
    );

}



/* =========================
   INITIAL LOAD
========================= */

displayRequests();

</script>
