<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusLoop - Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo .logo-circle {
            width: 55px;
            height: 55px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #4d67df;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        .auth-logo h1 {
            margin: 0;
            color: #202b5a;
        }

        .auth-logo p {
            color: #777;
            margin-top: 7px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            color: #777;
        }

        .auth-tab.active {
            color: #4d67df;
            border-bottom: 2px solid #4d67df;
            font-weight: bold;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4d67df;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4d67df;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-button:hover {
            opacity: 0.92;
        }

        .auth-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .auth-message.success {
            display: block;
            background: #e8f7ee;
            color: #18794e;
        }

        .auth-message.error {
            display: block;
            background: #fdecec;
            color: #c62828;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4d67df;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="auth-container">

    <div class="auth-card">


        <div class="auth-logo">

            <div class="logo-circle">
                ◉
            </div>

            <h1>CampusLoop</h1>

            <p>
                Your campus marketplace
            </p>

        </div>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                type="button"
                id="loginTab"
                class="auth-tab active">

                Login

            </button>


            <button
                type="button"
                id="registerTab"
                class="auth-tab">

                Register

            </button>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            class="auth-form active">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                    placeholder="Enter your email">

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    required
                    placeholder="Enter your password">

            </div>


            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <!-- REGISTER FORM -->

        <form
            id="registerForm"
            class="auth-form">

            <div class="form-group">

                <label for="registerName">
                    Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    required
                    placeholder="Enter your name">

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    required
                    placeholder="Enter your email">

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    required
                    minlength="6"
                    placeholder="Create a password">

            </div>


            <button
                type="submit"
                class="auth-button">

                Create Account

            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message">
        </div>


        <a
            href="index.html"
            class="back-home">

            ← Back to CampusLoop

        </a>


    </div>

</div>


<script src="js/auth.js"></script>

</body>

</html>
